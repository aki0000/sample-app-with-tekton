apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: image-scan
  labels:
    app.kubernetes.io/part-of: sample-app-ci
spec:
  description: Dummy container image scan (placeholder for Trivy, Clair, etc.)
  params:
    - name: IMAGE
      type: string
      description: Image reference that was built
    - name: SCANNER
      type: string
      default: dummy
    - name: SCAN_IMAGE
      type: string
      default: docker.io/library/busybox:1.36.1
  steps:
    - name: scan
      image: $(params.SCAN_IMAGE)
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "[image-scan] scanner=$(params.SCANNER) image=$(params.IMAGE) status=PASS (demo dummy)"
