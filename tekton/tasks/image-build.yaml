apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: image-build
  labels:
    app.kubernetes.io/part-of: sample-app-ci
spec:
  description: |
    Tekton buildah task (non-root UID 1000 / build user).
    See Red Hat OpenShift Pipelines 1.13 — unprivileged Buildah.
  params:
    - name: IMAGE
      type: string
      description: Image reference buildah will push
    - name: BUILDER_IMAGE
      type: string
      default: quay.io/buildah/stable:v1.39.0
      description: Buildah image with build user (UID 1000). RH example uses registry.redhat.io/rhel9/buildah
    - name: STORAGE_DRIVER
      type: string
      default: vfs
    - name: DOCKERFILE
      type: string
      default: ContainerFile
    - name: CONTEXT
      type: string
      default: .
      description: Build context directory relative to workspace
    - name: TLSVERIFY
      type: string
      default: "true"
    - name: FORMAT
      type: string
      default: oci
    - name: SKIP_PUSH
      type: string
      default: "false"
  workspaces:
    - name: source
    - name: dockerconfig
      optional: true
  volumes:
    - name: varlibcontainers
      emptyDir: {}
  steps:
    - name: build-and-push
      image: $(params.BUILDER_IMAGE)
      workingDir: $(workspaces.source.path)/$(params.CONTEXT)
      securityContext:
        runAsUser: 1000
        allowPrivilegeEscalation: true
      script: |
        #!/usr/bin/env bash
        set -eux
        echo "Running as USER ID $(id)"
        test -f target/sample.war
        test -f "$(params.DOCKERFILE)"
        mkdir -p /home/build/.config/containers /home/build/.docker
        cat > /home/build/.config/containers/registries.conf <<'EOF'
        unqualified-search-registries = ["docker.io"]
        short-name-mode = "enforcing"
        EOF
        if [ -d "$(workspaces.dockerconfig.path)" ] && \
           [ -f "$(workspaces.dockerconfig.path)/.dockerconfigjson" ]; then
          cp "$(workspaces.dockerconfig.path)/.dockerconfigjson" /home/build/.docker/config.json
        elif [ "$(params.SKIP_PUSH)" != "true" ]; then
          echo "ERROR: push requires docker-credentials workspace (Quay: quay-push-secret)" >&2
          exit 1
        fi
        buildah --storage-driver="$(params.STORAGE_DRIVER)" bud \
          --format="$(params.FORMAT)" \
          --tls-verify="$(params.TLSVERIFY)" \
          --no-cache \
          -f "$(params.DOCKERFILE)" \
          -t "$(params.IMAGE)" \
          "$(params.CONTEXT)"
        if [ "$(params.SKIP_PUSH)" = "true" ]; then
          echo "Push skipped"
          exit 0
        fi
        DIGEST_FILE=/tmp/image-digest
        buildah --storage-driver="$(params.STORAGE_DRIVER)" push \
          --tls-verify="$(params.TLSVERIFY)" \
          --digestfile "$DIGEST_FILE" \
          "$(params.IMAGE)" \
          "docker://$(params.IMAGE)"
        cat "$DIGEST_FILE"
      volumeMounts:
        - name: varlibcontainers
          mountPath: /home/build/.local/share/containers
