# Cluster admin が適用（Red Hat OpenShift Pipelines 1.13 第5章 5.1 相当）
# https://docs.redhat.com/ja/documentation/red_hat_openshift_pipelines/1.13/html/securing_openshift_pipelines/unprivileged-building-of-container-images-using-buildah
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: pipelines-scc-buildah-1000
  labels:
    app.kubernetes.io/part-of: sample-app-ci
priority: 10
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
allowedCapabilities: null
defaultAddCapabilities: null
fsGroup:
  type: MustRunAs
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - MKNOD
  - KILL
runAsUser:
  type: MustRunAs
  uid: 1000
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
users: []
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pipelines-scc-buildah-1000-clusterrole
  labels:
    app.kubernetes.io/part-of: sample-app-ci
rules:
  - apiGroups:
      - security.openshift.io
    resourceNames:
      - pipelines-scc-buildah-1000
    resources:
      - securitycontextconstraints
    verbs:
      - use
