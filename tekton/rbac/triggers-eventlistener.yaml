apiVersion: v1
kind: ServiceAccount
metadata:
  name: triggers-eventlistener
  labels:
    app.kubernetes.io/part-of: sample-app-ci
---
# github / cel の ClusterInterceptor 参照に必須（503 の典型原因）
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sample-app-ci-triggers-eventlistener-clusterroles
  labels:
    app.kubernetes.io/part-of: sample-app-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
subjects:
  - kind: ServiceAccount
    name: triggers-eventlistener
    namespace: sample-tomcat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: triggers-eventlistener-tekton-roles
  labels:
    app.kubernetes.io/part-of: sample-app-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
subjects:
  - kind: ServiceAccount
    name: triggers-eventlistener
