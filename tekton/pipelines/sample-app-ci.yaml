apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: sample-app-ci
  labels:
    app.kubernetes.io/part-of: sample-app-ci
spec:
  description: CI pipeline — git clone, code build, UT, static scan (dummy), image build, image scan (dummy)
  params:
    - name: git-url
      type: string
      description: Git repository URL
    - name: git-revision
      type: string
      default: main
    - name: image
      type: string
      description: Full image reference including tag (build and scan target)
    - name: context-dir
      type: string
      default: "."
      description: Project root inside the cloned repo
    - name: maven-image
      type: string
      default: docker.io/library/maven:3.9.9-eclipse-temurin-8
    - name: git-image
      type: string
      default: docker.io/alpine/git:2.47.2
      description: Git clone step image (avoid registry.redhat.io without pull secrets)
    - name: scan-image
      type: string
      default: docker.io/library/busybox:1.36.1
      description: Dummy scan steps image
    - name: tls-verify
      type: string
      default: "true"
    - name: builder-image
      type: string
      default: quay.io/buildah/stable:v1.39.0
    - name: storage-driver
      type: string
      default: vfs
    - name: image-format
      type: string
      default: oci
    - name: github-commit-sha
      type: string
      default: ""
      description: PR head commit SHA; when set, report status to GitHub
    - name: github-repo-full-name
      type: string
      default: ""
      description: GitHub repository full name (owner/repo)
    - name: github-status-context
      type: string
      default: tekton/sample-app-ci
      description: Context label for GitHub commit status
    - name: openshift-console-url
      type: string
      default: ""
      description: OpenShift console base URL for target_url link (optional)
  workspaces:
    - name: shared-source
      description: Cloned repository and build artifacts (WAR, etc.)
    - name: docker-credentials
      description: Registry push credentials (optional)
      optional: true
  tasks:
    - name: github-status-pending
      when:
        - input: $(params.github-commit-sha)
          operator: notin
          values: [""]
      taskRef:
        name: github-set-status
      params:
        - name: REPO_FULL_NAME
          value: $(params.github-repo-full-name)
        - name: SHA
          value: $(params.github-commit-sha)
        - name: STATE
          value: pending
        - name: DESCRIPTION
          value: Tekton CI running
        - name: CONTEXT
          value: $(params.github-status-context)
        - name: TARGET_URL
          value: $(params.openshift-console-url)/k8s/ns/$(context.pipelineRun.namespace)/tekton.dev~v1~PipelineRun/$(context.pipelineRun.name)

    - name: fetch-repository
      runAfter:
        - github-status-pending
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: GIT_IMAGE
          value: $(params.git-image)
      workspaces:
        - name: output
          workspace: shared-source

    - name: code-build
      runAfter:
        - fetch-repository
      taskRef:
        name: code-build
      params:
        - name: MAVEN_IMAGE
          value: $(params.maven-image)
        - name: CONTEXT_DIR
          value: $(params.context-dir)
      workspaces:
        - name: source
          workspace: shared-source

    - name: unit-test
      runAfter:
        - code-build
      taskRef:
        name: unit-test
      params:
        - name: MAVEN_IMAGE
          value: $(params.maven-image)
        - name: CONTEXT_DIR
          value: $(params.context-dir)
      workspaces:
        - name: source
          workspace: shared-source

    - name: static-scan
      runAfter:
        - unit-test
      taskRef:
        name: static-scan
      params:
        - name: CONTEXT_DIR
          value: $(params.context-dir)
        - name: SCAN_IMAGE
          value: $(params.scan-image)
      workspaces:
        - name: source
          workspace: shared-source

    - name: image-build
      runAfter:
        - static-scan
      taskRef:
        name: image-build
      params:
        - name: IMAGE
          value: $(params.image)
        - name: CONTEXT
          value: $(params.context-dir)
        - name: TLSVERIFY
          value: $(params.tls-verify)
        - name: BUILDER_IMAGE
          value: $(params.builder-image)
        - name: STORAGE_DRIVER
          value: $(params.storage-driver)
        - name: FORMAT
          value: $(params.image-format)
      workspaces:
        - name: source
          workspace: shared-source
        - name: dockerconfig
          workspace: docker-credentials

    - name: image-scan
      runAfter:
        - image-build
      taskRef:
        name: image-scan
      params:
        - name: IMAGE
          value: $(params.image)
        - name: SCAN_IMAGE
          value: $(params.scan-image)

  finally:
    - name: github-status-success
      when:
        - input: $(tasks.status)
          operator: in
          values: ["Succeeded"]
        - input: $(params.github-commit-sha)
          operator: notin
          values: [""]
      taskRef:
        name: github-set-status
      params:
        - name: REPO_FULL_NAME
          value: $(params.github-repo-full-name)
        - name: SHA
          value: $(params.github-commit-sha)
        - name: STATE
          value: success
        - name: DESCRIPTION
          value: All CI steps succeeded
        - name: CONTEXT
          value: $(params.github-status-context)
        - name: TARGET_URL
          value: $(params.openshift-console-url)/k8s/ns/$(context.pipelineRun.namespace)/tekton.dev~v1~PipelineRun/$(context.pipelineRun.name)

    - name: github-status-failure
      when:
        - input: $(tasks.status)
          operator: in
          values: ["Failed"]
        - input: $(params.github-commit-sha)
          operator: notin
          values: [""]
      taskRef:
        name: github-set-status
      params:
        - name: REPO_FULL_NAME
          value: $(params.github-repo-full-name)
        - name: SHA
          value: $(params.github-commit-sha)
        - name: STATE
          value: failure
        - name: DESCRIPTION
          value: Tekton CI failed
        - name: CONTEXT
          value: $(params.github-status-context)
        - name: TARGET_URL
          value: $(params.openshift-console-url)/k8s/ns/$(context.pipelineRun.namespace)/tekton.dev~v1~PipelineRun/$(context.pipelineRun.name)
