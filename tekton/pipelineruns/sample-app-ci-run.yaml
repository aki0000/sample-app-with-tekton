apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: sample-app-ci-
  labels:
    app.kubernetes.io/part-of: sample-app-ci
spec:
  pipelineRef:
    name: sample-app-ci
  params:
    - name: git-url
      value: https://github.com/aki0000/sample-app-with-tekton.git
    - name: git-revision
      value: main
    - name: image
      value: quay.io/akhino/sample-tomcat:v4
    - name: tls-verify
      value: "false"
  workspaces:
    - name: shared-source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    # Quay push 必須（未作成だと push で unauthorized）:
    # oc create secret docker-registry quay-push-secret \
    #   --docker-server=quay.io \
    #   --docker-username='akhino+robotname' \
    #   --docker-password='<quay-token>' \
    #   -n "$NS"
    - name: docker-credentials
      secret:
        secretName: quay-push-secret
        items:
          - key: .dockerconfigjson
            path: .dockerconfigjson
  taskRunTemplate:
    serviceAccountName: pipeline
  taskRunSpecs:
    - pipelineTaskName: image-build
      serviceAccountName: pipelines-sa-build
